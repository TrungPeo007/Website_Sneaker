spring.application.name=polysneaker
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.jsp.init-parameters.development=true
spring.web.resources.cache.period=0
server.port=${PORT:8080}

# ===== DATABASE (SQL Server) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Poly_Sneaker;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=ThanhTrung
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / HIBERNATE =====
# Database đã tạo bằng file SQL, nên để none, KHÔNG dùng create/update
spring.jpa.hibernate.ddl-auto=none
# Giữ nguyên tên cột kiểu PascalCase (ProductName, SalePrice...), không đổi thành product_name
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true